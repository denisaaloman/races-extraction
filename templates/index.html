<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curse → Word</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="header-mark">CT</div>
    <div class="header-text">
      <h1>Curse &rarr; Word</h1>
      <p>Incarci pozele foii de pontaj, generezi tabelul lunar.</p>
    </div>
  </header>

  <main class="app-main">

    <section class="panel drop-panel" id="drop-panel">
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.webp" multiple hidden>
        <div class="drop-icon">+</div>
        <p class="drop-label">Trage pozele aici sau apasa pentru a alege</p>
        <p class="drop-sub">JPG, PNG, WEBP</p>
      </div>
    </section>

    <section class="panel" id="gallery-panel" hidden>
      <div class="panel-head">
        <h2>Poze incarcate <span id="photo-count" class="count-badge">0</span></h2>
        <button class="btn-ghost" id="add-more-btn">+ adauga poze</button>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="panel config-panel" id="config-panel" hidden>
      <div class="field-row">
        <label for="luna-label">Nume fisier rezultat</label>
        <input type="text" id="luna-label" placeholder="ex: August2026" value="August2026">
      </div>

      <button class="btn-primary" id="generate-btn" disabled>Genereaza Word</button>
    </section>

    <section class="panel status-panel" id="status-panel" hidden>
      <div class="status-row">
        <div class="spinner" id="status-spinner"></div>
        <div class="status-text">
          <p id="status-title">Se proceseaza...</p>
          <p id="status-sub" class="status-sub"></p>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </section>

    <section class="panel result-panel" id="result-panel" hidden>
      <div class="result-icon" id="result-icon">&#10003;</div>
      <h2 id="result-title">Word generat</h2>
      <p id="result-detail" class="result-detail"></p>

      <div class="warnings" id="warnings-box" hidden>
        <h3 id="warnings-title"></h3>
        <ul id="warnings-list"></ul>
      </div>

      <a class="btn-primary" id="download-link" href="#" download>Descarca fisierul</a>
      <button class="btn-ghost" id="reset-btn">Incepe din nou</button>
    </section>

  </main>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <img id="lightbox-img" src="" alt="Previzualizare poza">
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
